# /etc/nginx/sites-available/mobihome — reverse proxy для Gunicorn.
# Замініть mobihome.example на свій домен; сертифікат — certbot (див. DEPLOYMENT.md).
server {
    listen 80;
    server_name mobihome.example www.mobihome.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mobihome.example www.mobihome.example;

    ssl_certificate     /etc/letsencrypt/live/mobihome.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobihome.example/privkey.pem;

    # Головне фото + до 20 додаткових по 10 МБ кожне.
    client_max_body_size 220m;

    location /static/ {
        alias /srv/mobihome/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/mobihome/media/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/mobihome/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django довіряє цьому заголовку лише при DJANGO_BEHIND_PROXY=True.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
