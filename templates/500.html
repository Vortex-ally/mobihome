<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Помилка сервера — mobi Home</title>
<style>
  :root { --bg: #0d1412; --card: #151f1c; --text: #e8ecf0; --muted: #b8b2aa; --accent: #B7A798; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 480px; text-align: center; background: var(--card); border-radius: 16px; padding: 32px 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; } p { color: var(--muted); line-height: 1.6; }
  a { display: inline-block; margin-top: 12px; color: var(--bg); background: var(--accent); padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Щось пішло не так</h1>
  <p>Ми вже знаємо про проблему. Спробуйте оновити сторінку за кілька хвилин. Якщо ви здійснювали оплату, її стан збережено — перевірте його в особистому кабінеті.</p>
  <a href="/">На головну</a>
</main>
</body>
</html>
