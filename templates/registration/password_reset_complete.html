{% extends "base.html" %}
{% block title %}Пароль змінено — mobi home{% endblock %}

{% block content %}
<div class="wrap py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-premium shadow-lg border-0 rounded-4 text-center p-4 p-md-5">
                <div class="rounded-circle mx-auto mb-4 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; background: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 2.25rem;">
                    ✅
                </div>
                <h1 class="h4 font-weight-bold mb-3" style="color: var(--text);">Пароль успішно змінено!</h1>
                <p class="text-muted small mb-4" style="line-height: 1.6;">
                    Ваш новий пароль встановлено. Тепер ви можете увійти до свій обліковий запис.
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'properties:auth' %}" class="btn btn-primary btn-lg py-3 rounded-3 font-weight-bold text-white shadow-sm" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none;">Увійти в акаунт →</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
