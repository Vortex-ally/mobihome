{% extends 'base.html' %}
{% block title %}Лист відправлено — mobi home{% endblock %}

{% block content %}
<div class="wrap py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-premium shadow-lg border-0 rounded-4 text-center p-4 p-md-5">
                <div class="rounded-circle mx-auto mb-4 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; background: rgba(37, 99, 235, 0.1); color: #2563eb; font-size: 2rem;">
                    📩
                </div>
                <h1 class="h4 font-weight-bold mb-3" style="color: var(--text);">Перевірте вашу пошту</h1>
                <p class="text-muted small mb-4" style="line-height: 1.6;">
                    Ми надіслали вам інструкції для встановлення нового пароля. Перевірте вхідні повідомлення та папку «Спам».
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'properties:auth' %}" class="btn btn-outline-primary py-2 rounded-3">Повернутися на сторінку входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
