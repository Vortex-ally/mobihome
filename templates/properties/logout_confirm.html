{% extends 'base.html' %}
{% block title %}Вихід — mobi Home{% endblock %}

{% block content %}
<div class="wrap py-5 text-center">
    <h1 class="h4 mb-3" style="color: var(--text);">Вийти з облікового запису?</h1>
    <form method="post" action="{% url 'properties:logout' %}" class="d-inline-block">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary px-4 py-2">Вийти</button>
    </form>
    <a href="{% url 'properties:profile' %}" class="btn btn-outline-secondary px-4 py-2 ms-2">Скасувати</a>
</div>
{% endblock %}
